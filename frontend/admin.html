<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff">
<title>STUDMART Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./admin.css">
</head><body>
<header class="nav">
  <a class="brand" href="./index.html"><span class="logo">s<span>m</span></span><span>STUD<span class="light">MART</span><small>ADMIN</small></span></a>
  <div class="nav-actions"><span class="a-who" id="adminName"></span><a class="plain" href="./index.html">Back to site</a></div>
</header>
<main class="admin">
  <div id="gate" class="card-a" hidden></div>
  <div id="app" hidden>
    <h1>Admin dashboard</h1>
    <nav class="a-tabs" aria-label="Admin sections">
      <button type="button" data-tab="pending" class="active">Verification requests <span id="pendingCount"></span></button>
      <button type="button" data-tab="users">All users</button>
      <button type="button" data-tab="listings">Listings</button><button type="button" data-tab="billboard">Billboard</button>
    </nav>
    <section id="tab-pending"></section>
    <section id="tab-users" hidden>
      <div class="a-filters">
        <input id="userSearch" type="search" placeholder="Search name, email or school" aria-label="Search users">
        <select id="userStatus" aria-label="Filter by status">
          <option value="">Any status</option><option value="none">Not verified</option><option value="pending">Pending</option><option value="approved">Verified</option><option value="rejected">Rejected</option>
        </select>
      </div>
      <div id="userList"></div>
    </section>
    <section id="tab-listings" hidden><div id="listingList"></div></section>
    <section id="tab-billboard" hidden>
      <p class="bb-intro">These slides rotate on the STUDMART home page. Add a photo or leave it blank, then save to publish. With no slides saved, the home page shows its built-in slides.</p>
      <div class="bb-actions"><button type="button" class="btn light" id="bbAdd">Add slide</button><button type="button" class="btn dark" id="bbSave">Save billboard</button></div>
      <div id="bbEditor"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
</main>
<script src="./media.js" defer></script><script src="./admin.js" defer></script>
</body></html>
